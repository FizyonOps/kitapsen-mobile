name: fushi_engine
resolution: workspace
description: >-
  Fushi 纯 Dart 引擎：互联 host 服务器（shelf）、配对/TLS、远程 OCR 作业、
  漫画 OCR 算法层、视频下载管线、刮削/字幕搜索、ffmpeg CLI 后端。
  同时被 Flutter app（fushi/）与无头服务端（packages/fushi_server）消费。
publish_to: none

# 本包 pubspec 不声明 flutter sdk：源码禁止 package:flutter / dart:ui / 任何
# method-channel 插件 import（守卫 fushi/test/build/fushi_engine_purity_guard_test.dart）。
# fushi_core / fushi_reading 零 Flutter；fushi_platform 仍声明 flutter，所以解析依赖时需要
# Flutter SDK 作为构建工具链；运行时二进制不含 Flutter（dart compile exe 是最终门）。
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  fushi_core:
    path: ../fushi_core
  fushi_reading:
    path: ../fushi_reading
  archive: ^3.6.1
  dio: ^5.1.1
  drift: ">=2.33.0 <2.34.0"
  html: ^0.15.2
  http: ^1.2.0
  meta: ^1.9.0
  path: ^1.8.2
  xml: ^6.3.0

dev_dependencies:
  lints: ^2.0.0
