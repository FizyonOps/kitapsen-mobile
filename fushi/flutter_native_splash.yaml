# Kitapsen native splash. Regenerate with:
#   dart run flutter_native_splash:create
# Source images live in branding/ (not bundled into the app). The Android 12+
# icon geometry (240dp canvas, 160dp circle, white icon background) is mirrored
# by the in-app start-up mark (lib/src/startup/startup_splash_mark.dart).
flutter_native_splash:
  color: "#FFFFFF"
  image: branding/splash_logo.png
  color_dark: "#000000"
  image_dark: branding/splash_logo_dark.png

  android_12:
    image: branding/splash_android12.png
    icon_background_color: "#FFFFFF"
    color: "#FFFFFF"
    color_dark: "#000000"
    icon_background_color_dark: "#FFFFFF"

  web: false
