plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "dev.flutter.flutter-gradle-plugin"
}

// Kitapsen ships no Mihon / Aniyomi extension host, so the extension ABI
// sources (generated from a Mihon archive and the vendored desktop sidecar)
// are not generated or compiled.

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// TODO-414: one-time migration floor for the Android versionCode. The CI build
// number (--build-number) is the monotonic `git rev-list --count HEAD` commit
// count (see release.yml / main.yml). The shipped versionCode is
//   versionCodeBase + 100 * versionCode + abiOffset
// 1_000_000_000 sits safely above every historically-shipped versionCode
// (the highest ever installed was ~6603) yet leaves ~10.9M commits of headroom
// before the int32 / Android 2.1e9 ceiling, so no user has to uninstall. The
// old `PUBSPEC_BUILD * 1_000_000 + seq` CI formula produced versionCode ~6.6e9,
// which overflowed int32 and exceeded Android's 2.1e9 limit, so beta/release
// Android packages could not be built. The maxVersionCode assertion in
// applicationVariants below fails the build loudly if it ever nears the ceiling.
// Kitapsen: a new store listing with no installed base, so the upstream
// 1_000_000_000 floor is dropped and the universal APK / AAB versionCode is
// exactly the pubspec build number (1.0.0+1 -> 1). Split-ABI APKs keep the
// 100 * build + abi offset scheme; they are never uploaded to the stores.
def versionCodeBase = 0
def maxVersionCode = 2100000000

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Kitapsen: release builds sign with the upload key from android/key.properties
// (Flutter template convention: storeFile resolves relative to android/app/).
// When the file is absent (fresh checkout, CI without secrets) the release
// variant falls back to the debug key so `flutter build appbundle --release`
// still works locally; such an artifact must never be uploaded to the stores.
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
    ["keyAlias", "keyPassword", "storeFile", "storePassword"].every { keystoreProperties[it] }

android {
    namespace "app.fushi.reader"
    compileSdk 36
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // v101 统一更新提醒引入 flutter_local_notifications：它自 v10 起用 java.time
        // 做定时通知的向后兼容，**即使只发即时通知也必须开 desugaring**（插件 README
        // 明写）。不开则 Android 构建在 dex 阶段直接失败。
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xcontext-parameters']
    }

    // Kitapsen: no Kotlin extension host sources and no torrent / P2P native
    // libraries (src/main/kotlin, the generated Mihon / Aniyomi ABI and the
    // native/fushi_torrent, native/fushi_p2p prebuilts are not added).

    defaultConfig {
        applicationId "com.fizyonops.kitapsen"
        minSdkVersion 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            // abiFilters omitted: --split-per-abi in CI controls ABI splits;
            // fat APK includes all ABIs by default
        }
    }

    // Kitapsen ships no dictionary: the native/fushidicts C++ engine (FFI + JNI
    // libraries) is not built.

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
        }
    }

    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
        pickFirst 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        // Kitapsen edition: ffmpeg-kit (video, audiobook, card audio) and async_zip
        // (Yomichan dictionary import) ship 4 KB-aligned native libraries, which
        // Google Play rejects (16 KB page size requirement). None of their features
        // exist in this edition; the ffmpeg-kit plugin already reports the native
        // library as unavailable instead of crashing when it is missing.
        exclude 'lib/*/libavcodec.so'
        exclude 'lib/*/libavdevice.so'
        exclude 'lib/*/libavfilter.so'
        exclude 'lib/*/libavformat.so'
        exclude 'lib/*/libavutil.so'
        exclude 'lib/*/libswresample.so'
        exclude 'lib/*/libswscale.so'
        exclude 'lib/*/libffmpegkit.so'
        exclude 'lib/*/libffmpegkit_abidetect.so'
        exclude 'lib/*/libasync_zip.so'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "kitapsen"
            def buildType = variant.buildType.name
            def architecture = output.getFilter(com.android.build.OutputFile.ABI)
            def newName

            if ("${architecture}" == "arm64-v8a") {
                architecture = "arm64"
            } else if ("${architecture}" == "armeabi-v7a") {
                architecture = "armeabi"
            }

            if ("${architecture}" == "null") {
                if (buildType == 'debug') {
                    newName = "${appName}_${defaultConfig.versionName}-debug.apk"
                } else {
                    newName = "${appName}_${defaultConfig.versionName}.apk"
                }
                // HBK-AUDIT-071: the fat-APK branch computed newName but never
                // applied it, so the fat APK kept the default app-<type>.apk
                // name. Assign it like the split-ABI branch does.
                outputFileName = newName
                def computed = versionCodeBase + project.android.defaultConfig.versionCode
                if (computed > maxVersionCode) {
                    throw new GradleException("Android versionCode ${computed} exceeds the ${maxVersionCode} ceiling (int32 / Android limit). Reduce versionCodeBase or the build number; see TODO-414.")
                }
                output.versionCodeOverride = computed
            } else {
                if (buildType == 'debug') {
                    newName = "${appName}_${defaultConfig.versionName}-${architecture}-debug.apk"
                } else {
                    newName = "${appName}_${defaultConfig.versionName}-${architecture}.apk"
                }

                def offset
                if (architecture == "armeabi") {
                    offset = 1
                } else if (architecture == "arm64") {
                    offset = 2
                } else if (architecture == "x86_64") {
                    offset = 3
                }

                outputFileName = newName
                def computed = versionCodeBase + (100 * project.android.defaultConfig.versionCode) + offset
                if (computed > maxVersionCode) {
                    throw new GradleException("Android versionCode ${computed} exceeds the ${maxVersionCode} ceiling (int32 / Android limit). Reduce versionCodeBase or the build number; see TODO-414.")
                }
                output.versionCodeOverride = computed
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // 与 compileOptions 的 coreLibraryDesugaringEnabled 成对；版本对齐
    // flutter_local_notifications 自身 android/build.gradle 里钉的那个。
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.webkit:webkit:1.12.0"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:2.2.20"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.umair13adil:RxLogs:v1.0.18'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // Kitapsen: no AnkiDroid API, no ML Kit text recognition (manga / screen
    // OCR) and none of the Mihon extension host runtime (okhttp, jsoup, rx,
    // injekt, quickjs, kotlinx serialization, compose runtime).
}
