name: fushi
resolution: workspace
description: Kitapsen e-book reader by FizyonOps, based on Fushi (GPLv3).
publish_to: 'none'
version: 1.0.0+14
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: "^3.41.6"

dependencies:
  archive: ^3.6.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  device_info_plus: ^9.0.0
  dio: ^5.1.1
  dynamic_color: ^1.7.0
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fushi_core:
    path: ../packages/fushi_core
  fushi_engine:
    path: ../packages/fushi_engine
  fushi_reading:
    path: ../packages/fushi_reading
  fushi_platform:
    path: ../packages/fushi_platform
  flutter_cache_manager: ^3.3.0
  flutter_charset_detector: ^1.0.2
  flutter_colorpicker: ^1.1.0
  flutter_markdown: ^0.6.18
  flutter_html: ^3.0.0
  flutter_inappwebview: ^6.1.5
  flutter_logs: ^2.1.11
  flutter_riverpod: ^2.3.6
  fluttertoast: ^8.2.1
  drift: ">=2.33.0 <2.34.0"
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ">=3.4.0 <4.0.0"
  http: ^1.2.0
  html: ^0.15.2
  image: ^4.3.0
  intl: ^0.20.2
  json_annotation: ^4.8.1
  json_serializable: ^6.6.1
  # Kitapsen: Google Play In-App Updates (store-native update prompt that
  # replaces the GitHub release updater; see lib/src/updates/store_update_check.dart).
  in_app_update: ^5.0.0
  material_color_utilities: ^0.13.0
  package_info_plus: ^4.0.2
  path: ^1.8.2
  path_provider: ^2.0.13
  # PDF 阅读器（Phase 0 spike）：PDFium 底层、字符级文本矩形供点选查词。
  # 五平台 + native-assets/build-hook 下载 PDFium。见 docs/specs/pdf-reader-lookup。
  # 钉 2.4.5：>=2.4.6 经 pdfrx_engine 拉 image ^4.8.0 → 要 archive ^4.0.7 / xml ^7.0.1，
  # 与本仓 archive ^3.6.1 / xml ^6.3.0 冲突（升 archive/xml 主版本代价大，Phase 0 先钉）。
  pdfrx: 2.4.5
  receive_intent:
    git:
      url: https://github.com/arianneorpilla/receive_intent
      ref: 3854d07f8f4e9d5a78589639b18b5d454ddf54a0
  restart_app: ^1.1.2
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2
  slang: ^3.13.0
  slang_flutter: ^3.13.0
  stack_trace: ^1.11.1
  crypto: ^3.0.0
  transparent_image: ^2.0.1
  url_launcher: ^6.0.20
  wakelock_plus: ^1.1.4
  brotli: ^0.6.0
  flutter_web_auth_2: ^5.1.0
  sign_in_with_apple: ^8.2.0
dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^2.0.1
  flutter_native_splash: ^2.2.8

flutter:
  uses-material-design: true

  assets:
    # Kitapsen edition: only the launcher / splash / store artwork and the
    # ebook-reader licence are bundled. App Review treats unused assets as
    # hidden features (guideline 2.3.1).
    - assets/licenses/ebook-reader.txt
    - assets/meta/
