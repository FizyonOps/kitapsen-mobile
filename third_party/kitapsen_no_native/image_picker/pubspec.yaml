version: 0.8.7+5

environment:
  sdk: ">=2.18.0 <4.0.0"
  flutter: ">=3.3.0"

flutter: {}

dependencies:
  flutter:
    sdk: flutter
  image_picker_platform_interface: ^2.6.1
