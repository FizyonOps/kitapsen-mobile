# Kitapsen edition: Dart API of this package without its native plugin
# (no Android/iOS code is bundled). Its feature is compiled out of the
# app; see third_party/kitapsen_no_native/README.md.
name: google_sign_in
description: Flutter plugin for Google Sign-In, a secure authentication system
  for signing in with a Google account.
repository: https://github.com/flutter/packages/tree/main/packages/google_sign_in/google_sign_in
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+google_sign_in%22
version: 6.3.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

flutter: {}

dependencies:
  flutter:
    sdk: flutter
  google_sign_in_platform_interface: ^2.5.0

topics:
  - authentication
  - google-sign-in

# The example deliberately includes limited-use secrets.
false_secrets:
  - /example/android/app/google-services.json
  - /example/ios/Runner/Info.plist
  - /example/ios/RunnerTests/GoogleService-Info.plist
  - /example/ios/RunnerTests/GoogleSignInTests.m
  - /example/macos/Runner/Info.plist
